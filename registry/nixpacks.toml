# Railway builds from registry/ but the full repo is cloned (parent has npm workspaces).
# Use npm ci --no-workspaces + package-lock.json to avoid npm edgesOut failures.
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci --no-workspaces"]

[phases.build]
cmds = [
  "npm run prisma:generate",
  "npm run build"
]

[start]
cmd = "npm run start"
