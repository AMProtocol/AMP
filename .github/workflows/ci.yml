name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Root workspace install hits npm arborist edgesOut bugs; match Railway per-service installs.
      - name: Install validator
        working-directory: validator
        run: npm ci --no-workspaces
      - name: Install registry
        working-directory: registry
        run: npm ci --no-workspaces
      - name: Install amp-mcp
        working-directory: amp-mcp
        run: npm ci
      - run: npm run check-schemas
      - name: Prisma generate
        working-directory: registry
        run: npx prisma generate
      - name: Build validator
        working-directory: validator
        run: npm run build
      - name: Build registry
        working-directory: registry
        run: npm run build
      - name: Build amp-mcp
        working-directory: amp-mcp
        run: npm run build
      - name: Test validator
        working-directory: validator
        run: npm test
      - name: Test registry
        working-directory: registry
        run: npm test
      - name: Test amp-mcp
        working-directory: amp-mcp
        run: npm test
